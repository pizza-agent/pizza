<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Pizza</title>
		<script>
			(function () {
				try {
					var saved = localStorage.getItem("pizza-theme");
					var mode =
						localStorage.getItem("pizza-theme-mode") ||
						(saved === "dark" ? "dark" : "light");
					if (mode === "dark") {
						document.documentElement.classList.add("dark");
					}
					if (saved && saved !== "light" && saved !== "dark") {
						document.documentElement.dataset.theme = saved;
					}
					var css = localStorage.getItem("pizza-theme-css");
					if (css) {
						var style = document.createElement("style");
						style.id = "pizza-custom-theme";
						style.textContent = css;
						document.head.appendChild(style);
					}
					var extraCss = localStorage.getItem("pizza-theme-extra-css");
					if (extraCss) {
						var extra = document.createElement("style");
						extra.id = "pizza-custom-theme-extra";
						extra.textContent = extraCss;
						document.head.appendChild(extra);
					}
					var themeTitle = localStorage.getItem("pizza-theme-title");
					if (themeTitle) {
						document.title = themeTitle;
					}
					var themeIcon = localStorage.getItem("pizza-theme-icon");
					if (themeIcon) {
						var fav = document.createElement("link");
						fav.id = "pizza-theme-favicon";
						fav.rel = "icon";
						fav.href = themeIcon;
						document.head.appendChild(fav);
					}
				} catch (e) {}
			})();
		</script>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
