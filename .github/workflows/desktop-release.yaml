name: Desktop Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for the release (required for manual runs)'
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            label: macos-arm64
          - os: ubuntu-22.04
            label: linux-x64
          - os: windows-2022
            label: windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/target
          key: cargo-${{ matrix.label }}-${{ hashFiles('apps/desktop/Cargo.lock') }}
          restore-keys: cargo-${{ matrix.label }}-

      - name: Cache tauri tools
        uses: actions/cache@v5
        with:
          path: |
            ~/.tauri
            ~/.local/share/tauri
          key: tauri-tools-${{ matrix.label }}

      - name: Install tauri-cli
        run: |
          curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
          cargo binstall tauri-cli --version "^2.0" --no-confirm

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf libgtk-3-dev libayatana-appindicator3-dev

      - name: Configure npm shell (Windows)
        if: runner.os == 'Windows'
        run: npm config set script-shell bash

      - name: Install root dependencies
        run: npm ci

      - name: Install web dependencies
        # Remove node_modules and lock file so npm install resolves
        # fresh platform-specific rollup optional deps (npm/cli#4828).
        # Use bash shell for `rm -rf` compatibility on Windows.
        run: rm -rf node_modules package-lock.json && npm install
        working-directory: apps/web
        shell: bash

      - name: Check updater signing setup
        run: |
          if grep -q 'REPLACE_WITH_TAURI_UPDATER_PUBLIC_KEY' apps/desktop/tauri.conf.json; then
            echo "::error::Set plugins.updater.pubkey in apps/desktop/tauri.conf.json"
            exit 1
          fi
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::Missing TAURI_SIGNING_PRIVATE_KEY secret"
            exit 1
          fi
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        shell: bash

      # tauri.updater.conf.json enables signed updater artifacts (.app.tar.gz,
      # AppImage, setup.exe + .sig). Kept out of tauri.conf.json so local
      # builds work without the signing key.
      - name: Build and bundle
        run: |
          if [ "$LABEL" = "linux-x64" ]; then
            npm run build:desktop -- --config tauri.updater.conf.json --bundles deb,rpm,appimage
          else
            npm run build:desktop -- --config tauri.updater.conf.json
          fi
        env:
          PIZZA_VENDOR_TOOL_TARGETS: current
          LABEL: ${{ matrix.label }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: bash

      - name: Rename artifacts with platform name
        run: |
          LABEL="${{ matrix.label }}"
          PLATFORM="${LABEL%%-*}"
          ARCH="${LABEL##*-}"
          BUNDLE_DIR="apps/desktop/target/release/bundle"
          VERSION=$(grep -o '"version": "[^"]*"' apps/desktop/tauri.conf.json | head -1 | cut -d'"' -f4)

          find "$BUNDLE_DIR" -type f \( -name "*.dmg" -o -name "*.deb" -o -name "*.rpm" -o -name "*.exe" -o -name "*.msi" -o -name "*.AppImage" -o -name "*.app.tar.gz" \) | while read -r file; do
            dir=$(dirname "$file")
            base=$(basename "$file")
            prefix="Pizza_${VERSION}_${PLATFORM}_${ARCH}"
            case "$base" in
              *.app.tar.gz)
                new_name="${prefix}.app.tar.gz"
                ;;
              *.dmg|*.deb|*.rpm|*.AppImage)
                new_name="${prefix}.${base##*.}"
                ;;
              *-setup.exe)
                new_name="${prefix}-setup.exe"
                ;;
              *.exe)
                new_name="${prefix}.exe"
                ;;
              *.msi)
                lang=$(echo "$base" | sed -n "s/.*_\(.*\)\.msi/\1/p")
                if [ -n "$lang" ]; then
                  new_name="${prefix}_${lang}.msi"
                else
                  new_name="${prefix}.msi"
                fi
                ;;
            esac
            if [ "$base" != "$new_name" ]; then
              mv "$file" "$dir/$new_name"
              echo "Renamed: $base -> $new_name"
            else
              echo "Already named: $base"
            fi
            # Keep the updater signature next to its (renamed) bundle.
            if [ -f "$file.sig" ] && [ "$base" != "$new_name" ]; then
              mv "$file.sig" "$dir/$new_name.sig"
            fi
          done
        shell: bash

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: pizza-${{ matrix.label }}
          path: |
            apps/desktop/target/release/bundle/**/*.dmg
            apps/desktop/target/release/bundle/**/*.deb
            apps/desktop/target/release/bundle/**/*.rpm
            apps/desktop/target/release/bundle/**/*.msi
            apps/desktop/target/release/bundle/**/*.exe
            apps/desktop/target/release/bundle/**/*.AppImage
            apps/desktop/target/release/bundle/**/*.app.tar.gz
            apps/desktop/target/release/bundle/**/*.sig
          if-no-files-found: error

  release:
    name: Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true

      - name: Checkout scripts
        uses: actions/checkout@v5
        with:
          path: src
          sparse-checkout: scripts

      - name: Generate updater manifest
        run: node src/scripts/generate-updater-manifest.mjs artifacts "$TAG" artifacts/latest.json
        env:
          TAG: ${{ inputs.tag_name || github.ref_name }}

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          body: |
            ## Quick Start

            ### Desktop

            Download the installer for your platform (macOS / Linux / Windows), install and launch.

            **For macOS users**: Since the app is unsigned, you may see "Pizza.app is damaged and can't be opened." Run the following command in Terminal to fix this:

            ```bash
            xattr -cr /Applications/Pizza.app
            ```

            ### CLI

            ```bash
            npm install -g @tomsun28/pizza
            pizza
            ```
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.deb
            artifacts/**/*.rpm
            artifacts/**/*.msi
            artifacts/**/*.exe
            artifacts/**/*.AppImage
            artifacts/**/*.app.tar.gz
            artifacts/**/*.sig
            artifacts/latest.json
          generate_release_notes: true
          draft: ${{ github.event_name == 'workflow_dispatch' }}
